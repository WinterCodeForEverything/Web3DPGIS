# nginx for the full platform; setup.sh replaces DOMAIN and installs it as /etc/nginx/sites-available/3dpgis.
# HTTPS only. nginx serves the built front end, the 3D Tiles and thumbnails itself and passes the rest to gunicorn.

server {
	listen 80;
	listen [::]:80;
	server_name DOMAIN;

	# Let's Encrypt renewals
	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name DOMAIN;

	ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	server_tokens off;
	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options nosniff always;

	# uploads: keep in step with MAX_UPLOAD_SIZE in /srv/3DPGIS/.env (2 GiB)
	client_max_body_size 2g;
	client_body_timeout 300s;

	gzip on;
	gzip_types application/json application/javascript text/css image/svg+xml;

	location /static/ {
		alias /srv/3DPGIS/app/staticfiles/;
		expires 30d;
		access_log off;
	}

	# original uploads and reconstruction photos stay private; only the app reads them
	location /media/package/ {
		return 404;
	}
	location /media/recon/ {
		return 404;
	}
	location /media/tmp/ {
		return 404;
	}

	# 3D Tiles and thumbnails (with STORAGE_BACKEND=s3 browsers read them from the bucket instead)
	location /media/ {
		alias /srv/3DPGIS/media/;
		expires 7d;
		access_log off;
	}

	location /label-icons/ {
		alias /srv/3DPGIS/app/assets/label-icons/;
		expires 7d;
	}

	location / {
		proxy_pass http://127.0.0.1:8000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
	}
}
