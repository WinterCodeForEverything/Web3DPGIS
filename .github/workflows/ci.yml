name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_DEBUG: "true"
  DJANGO_SECRET_KEY: ci-only-secret
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_USER: southcloud
  POSTGRES_PASSWORD: southcloud
  POSTGRES_DB: southcloud
  CELERY_BROKER_URL: redis://localhost:6379/0

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: southcloud
          POSTGRES_PASSWORD: southcloud
          POSTGRES_DB: southcloud
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U southcloud" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (GDAL/GEOS for GeoDjango, assimp for mesh conversion)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev binutils libproj-dev assimp-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: converters/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: converters
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
      - name: Tests (API, permissions, spatial search, pipeline with real converters, S3 storage, migrations)
        run: python manage.py test -v 2

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  e2e:
    name: Browser end-to-end
    needs: [ backend, frontend ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: southcloud
          POSTGRES_PASSWORD: southcloud
          POSTGRES_DB: southcloud
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U southcloud" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8
        ports: [ "6379:6379" ]
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev binutils libproj-dev assimp-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            converters/package-lock.json
            frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: converters
      - run: npm ci
        working-directory: frontend
      - name: Run the browser test (throwaway database, worker and server)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          E2E_BROKER_URL: redis://localhost:6379/1
        run: scripts/e2e.sh
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore
