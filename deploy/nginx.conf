# nginx in front of gunicorn (replaces the old Apache + mod_wsgi setup).
# Build the app and collect static files first:
#   (cd frontend && npm ci && npm run build) && python manage.py collectstatic --noinput
# Then run the API and a processing worker:
#   gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 3
#   celery -A config worker -l info
# Django serves the Vue app's index.html for page URLs; its assets are under /static/app/.

server {
	listen 80;
	server_name _;

	# 3D model archives can be large
	client_max_body_size 2g;

	location /static/ {
		alias /srv/3DPGIS/staticfiles/;
		expires 7d;
	}

	# only used with STORAGE_BACKEND=local; with S3 storage browsers fetch files from the bucket or CDN
	location /media/ {
		alias /srv/3DPGIS/media/;
	}

	# label icon images, also only with STORAGE_BACKEND=local (LABEL_ICON_ROOT)
	location /label-icons/ {
		alias /srv/3DPGIS/assets/label-icons/;
		expires 7d;
	}

	location / {
		proxy_pass http://127.0.0.1:8000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
	}
}
