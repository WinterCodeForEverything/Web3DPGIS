# nginx in front of gunicorn (replaces the old Apache + mod_wsgi setup).
# Run the app with:  gunicorn cloudplat.wsgi:application --bind 127.0.0.1:8000 --workers 3
# and collect static files first:  python manage.py collectstatic --noinput

server {
	listen 80;
	server_name _;

	# 3D model archives can be large
	client_max_body_size 2g;

	location /static/ {
		alias /srv/3DPGIS/staticfiles/;
		expires 7d;
	}

	location /media/ {
		alias /srv/3DPGIS/media/;
	}

	location / {
		proxy_pass http://127.0.0.1:8000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
	}
}
