<meta charset="utf-8">
<title>Measure</title>
<head>
  <style>
	.measure_a {
		float: left;
		color: white;
		width: 40%;
		height: 8%;
		margin-left: 6%;
		margin-top: 5%;
		margin-bottom: 5%;
	}
	.measure_image {
		margin-left: 10%;
		width: 60%;
		height: 80%;
		background: rgba(250, 250, 250);
	}
	.measure_text {
		font-size: 1vw;
	}
	#measure_remove {
		position: absolute;
		bottom: 5%;
		right: 5%;
		width: 90%;
		height:6%;
		font-size: 1vw;
	}
  </style>
  <script src="/static/js/createEntity.js"></script>
  <script src="/static/js/measuring/getPointCoord.js"></script>
  <script src="/static/js/measuring/getTriangleDistance.js"></script>
  <script src="/static/js/measuring/getPolylineDistance.js"></script>
  <script src="/static/js/measuring/getPolygonArea.js"></script>
  <script src="/static/js/measuring/getCircleArea.js"></script>
</head>
<body>
<div>
	<a class="measure_a" href="#" onclick = "getPointCoord()">
		<img src="/static/icon/point.png" class = "measure_image" alt="Measuring" /><br>
		<p class = "measure_text">坐标测量</p>
	</a>
	<a class="measure_a" href="#" onclick = "getTriangleDistance()">
		<img src="/static/icon/triangleLine.png" class = "measure_image" alt="Measuring" /><br>
		<p class = "measure_text">三角测量</p>
	</a>
	<a class="measure_a" href="#" onclick = "getPolylineDistance()">
		<img src="/static/icon/polyline.png" class = "measure_image" alt="Measuring" /><br>
		<p class = "measure_text">距离测量</p>
	</a>
	<a class="measure_a" href="#" onclick = "getPolygonArea()">
		<img src="/static/icon/polygon.png" class = "measure_image" alt="Measuring" /><br>
		<p class = "measure_text">面积测量</p>
	</a>
	<a class="measure_a" href="#" onclick = "getCircleArea()">
		<img src="/static/icon/circle.png" class = "measure_image" alt="Measuring" /><br>
		<p class = "measure_text">范围测量</p>
	</a>
	<input type="button" id="measure_remove" value="删除所有测量结果" onclick = "removeAllEntity()" />
</div>
</body>
