{% block content %}
{% load static %}
<head>
	<meta charset="utf-8">
	<title>Main</title>
	<script src="/static/js/jquery-3.3.1.js"> </script>
	<script src="/static/js/bootstrap.min.js"> </script>
	<link href="/static/css/bootstrap.min.css" rel="stylesheet">
	<style type="text/css">@import url(/static/css/main.css);</style>
	<script>
		let canSee_url = "{% url 'canSee' %}";
		let delete_url = "{% url 'delete' %}";
	</script>
	<script src="/static/js/main.min.js"></script>
</head>


<body>
	<div id = "pg_header">
        <a target="_blank" href="http://www.southsurvey.com/"><img src="/static/image/logo.png" width="200" height="45">
        <a href="#about" id ="about">关于(A)</a>
        <a href="{% url 'help' %}" id ="help">帮助(?)</a>
    </div>
	<div id="model_header">
		<p>南方三维线上展示平台</p>
		<a  href = "{% url 'newItems' %}">新建模型</a>
	</div>
	{% for item in publicModels %}
	<div class="modelblock" align = "center">		
		<a id="{{ item.id }}_a">
			<div class="model">
			<img src="/media/{{ item.image }}" alt="Model Image" ><br/>
			</div>
			{{ item.name }}
		</a><br/>
		
		<div class="metablock">
		<a id="{{ item.id }}_see" class="icon" href=""><img>可见</a>
		<a id="{{ item.id }}_share" class="icon" href=""><img src="/static/icon/share.svg">分享</a>
		<a id="{{ item.id }}_delete" class="icon" href=""><img src="/static/icon/delete.svg">删除</a>
		</div>
		<script>management( "{{ item.id }}", "{% url 'show' %}?id={{ item.id }}", {{ item.canSee }} );</script>
	</div>
	{% endfor %}
	<div class="modal fade" id="share_model" tabindex="-1" role="dialog">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-body">
					<input type="url" id="model_url"></input>
					<button type="button" class="btn btn-primary" id="copy_button">复制</button>
				</div>
			</div>
		</div>
	</div>
	<div class="modal fade" id="cannot_share_model" tabindex="-1" role="dialog">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-body">
					<p>请先将模型设为可见，在不可见状态下无法分享！</p>
				</div>
			</div>
		</div>
	</div>
</body>
{% endblock %}
