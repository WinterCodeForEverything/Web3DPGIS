<html>
<head>
<style>
	#modelToolsManage {

		height: 100%;

	}
	#modelTools {

		top: 0;
		left: 4%;
		width: 13%;
		height: 100%;
		background: rgba(42, 42, 42, 0.7);

	}

<script src="/static/js/modeltools.js"></script>
</head>
<body>
	<div id = "modelToolsManage">
