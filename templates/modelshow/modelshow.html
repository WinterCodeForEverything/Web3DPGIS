{% block content %}
<html>
<head>
	<!-- Use correct character set. -->
	<meta charset="utf-8">
	<!-- Tell IE to use the latest, best version. -->
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<!-- Make the application on mobile take up the full browser screen and disable user scaling. -->
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
	<title>SouthCloud</title>
	<script src="/static/ThirdParty/Cesium/Cesium.js"></script>
	<script src = "/static/js/jquery-3.3.1.js"> </script>
	<script src="/static/js/bootstrap.min.js"> </script>
	<link href="/static/css/bootstrap.min.css" rel="stylesheet">
	<link href="/static/css/modelshow.css" rel="stylesheet">
	<link href="/static/css/flight.css" rel="stylesheet">
	{% include 'templates_url.html' %}
</head>
<body> 
	<div id="cesiumContainer"></div>
	<script src="/static/js/modelshow.js"></script>
	<script src="/static/js/createEntity.js"></script>
	{% include 'modelshow/modeltools.html' %}
	{% include 'addLabel/showLabel.html' %}
<div class="modal fade" id="modal_alert" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<p style="margin:0px"></p>
			</div>
		</div>
	</div>
</div>
<div class="modal fade" id="modal_confirm" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<p style="margin:0px"></p>
			</div>
			<div class="modal-footer">
				<button id="btnConfirmConfirm" type="button" class="btn btn-primary" data-dismiss="modal">确认</button>
				<button id="btnConfirmCancel" type="button" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>
<div class="modal fade" id="modal_prompt" tabindex="-1" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body">
				<p style="margin:0px"><strong></strong><input id="promptInput"></input></p>
			</div>
			<div class="modal-footer">
				<button id="btnPromptConfirm" type="button" class="btn btn-primary" data-dismiss="modal">确认</button>
				<button id="btnPromptCancel" type="button" class="btn btn-default" data-dismiss="modal">取消</button>
			</div>
		</div>
	</div>
</div>
</body>
</html>
{% endblock %}
