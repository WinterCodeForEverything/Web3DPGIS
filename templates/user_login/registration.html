{% block content %}
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<style type="text/css">@import url(/static/css/registration.css);</style>
</head>
<body>
	<div class = "pg_header">
		<a target="_blank" href="http://www.southsurvey.com/"><img src="/static/image/logo.png" width="200" height="48px"></a>
		<a href ="#about" id="about">关于(A)</a>
	</div>
	<div class="title">
		<p>SouthScene Online</p>
	</div>
	<div class="Background">

		<div class="form-wrapper">
		<form method="post" action="" enctype="multipart/form-data">
			{% csrf_token %}
			{% for field in form %}
				<div class="fieldWrapper">
				{{ field.errors }}
				{{ field.label_tag }} {{ field }} 
				{% if field.help_text %}
					<p class="help">{{ field.help_text|safe }}</p>
				{% endif %}
				</div>
				{% endfor %}
			<div class="button-wrapper-submit">
				<input type="submit" value="注册" />
			</div>
		</form>
		</div>
	</div>
</body>
</html>
{% endblock %}
