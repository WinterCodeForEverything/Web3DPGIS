<head>
<style>
 	.others_a {
		float: left;
		color: white;
		width: 40%;
		height: 8%;
		margin-left: 6%;
		margin-top: 5%;
		margin-bottom: 5%;
	}
	.others_image {
		margin-left: 10%;
		width: 60%;
		height: 80%;
		background: rgba(250, 250, 250);
	}	
	.others_text {
		font-size: 1vw;
	}
</style>
<script>
(function(){
	if (-1 != window.location.href.search('path=True'))
	{
		var bjudge = false;
		$('#adjustheight_a').click( function(){
			bjudge = !bjudge;
			if( bjudge )
			{
				$('#adjustheight').load("{% url 'getHeightHtml' %}");
			}
			else
				$('#adjustheight').empty();
		});
	}
	else
	{
		$('#adjustheight_a').css( 'display', 'none' );
	}
}());
</script>
</head>
<body>
	<div id="adjustheight"></div>
	<a class="others_a" id="adjustheight_a" href="#">
		<img src="/static/icon/heightAdjust.png" class = "others_image" alt="OtherTools" /><br>
		<p class = "others_text">高度调节</p>
	</a>
</body>
