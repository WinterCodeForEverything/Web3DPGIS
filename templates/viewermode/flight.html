<head>
<script src="/static/js/flight.js"></script>
</head>
<body>
<div id = "flysight">
	<span style="line-height:100%">
		<p id="flightTitle" class="font-white">飞行</p>
		<select id="flightPaths"></select>
		<div style="clear:both"></div>
	</span>
	<hr style="border-style: inset;border-width:1px"/>
	<div id="flightPoints"></div>
	<div id="flightButtons" class="btn-group">
		<button id="newFlight" class="btn btn-default">新建<br/>路径</button>
		<button id="addPoint" class="btn btn-default">添加<br/>航点</button>
		<button id="savePoints" class="btn btn-default">保存<br/>路径</button>
		<button id="playFlight" class="btn btn-default">循环<br/>播放</button>
		<button id="stopPlayFlight" class="btn btn-default">停止<br/>播放</button>
		<button id="deleteFlight" class="btn btn-default">删除<br/>路径</button>
	</div>
</div>
</body>
