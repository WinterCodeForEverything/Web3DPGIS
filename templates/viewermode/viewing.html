<html>
{% block content %}
<head>
<style>
	.viewer_a {
		float: left;
		color: white;
		width: 40%;
		height: 8%;
		margin-left: 6%;
		margin-top: 5%;
		margin-bottom: 5%;
	}
	.viewer_image {
		margin-left: 10%;
		width: 60%;
		height: 80%;
		background: rgba(250, 250, 250);
	}
	.viewer_text {
		font-size: 1vw;
	}
	#viewer_cancel {
		position: absolute;
		bottom: 5%;
		right: 5%;
		width: 90%;
		height:6%;
		font-size: 1vw;
	}
</style>
<script src="/static/js/walkmode.js"></script>
</head>
<body>
	<a class="viewer_a" id="viewer_walk" href="#">
		<img src="/static/icon/walk.svg" class = "viewer_image" alt="Viewing" /><br>
		<p class = "viewer_text">行走模式</p>
	</a>
	<a class="viewer_a" id="viewer_flight" href="#">
		<img src="/static/icon/flight.svg" class = "viewer_image" alt="Viewing" /><br>
		<p class = "viewer_text">飞行浏览</p>
	</a>
	<input type="button" id="viewer_cancel" value="取消浏览" />
	{% include 'viewermode/flight.html' %}
</body>
{% endblock %}
</html>
