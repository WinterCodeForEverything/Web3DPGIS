<html>
{% block content %}
<meta charset="utf-8">
<title>Label</title>
<head>
  <style>
	.label_input {
		float: left;
		margin-top: 10%;
		margin-left: 10%;
		width: 20%;
		height: 5%;
		background: rgba( 250, 250, 250 );
	}
	#label_bottom {
		position: absolute;
		bottom: 5%;
	}
	.label_button {
		position: relative;	
		margin-left: 10%;
		margin-top: 10%;
		width: 80%;
		height: 5%;
		font-size: 1vw;
	}
  </style>
  <script src="/static/js/addlabel.js"></script>
</head>
<body>
	{% for label in labelbase %}
		<input type="image" src="/media/label/{{ label.source }}" class = "label_input" id="label_{{ label.id }}" alt="Label" />
		<script>addLabel( "{{ label.id }}" );</script>
	{% endfor %}
	<input type="image" src="/media/label/addlabel.png" class = "label_input" id = "labelbase_add" alt="Label Add" />
	<input type="file" id = "labelbase_file" accept="image/png,image/jpeg" style="display:none;" />
	<div id="label_bottom">
		<input type="button" class="label_button" id="label_save" value="保存" />
		<input type="button" class="label_button" id="label_delete_unsave" value="删除全部未保存图标" />
		<input type="button" class="label_button" id="label_delete_save" value="删除全部已保存图标" />
	</div>
</body>
{% endblock %}
</html>
