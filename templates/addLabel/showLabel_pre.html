<head>
</head>
<body>
	<div class="modal fade" id="modal_marker" tabindex="-1" role="dialog" data-backdrop="static">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-body">
					<table class="table" id="troot">
					</table>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-default" data-dismiss="modal">关闭</button>
				</div>
			</div>
		</div>
	</div>
	<script src="/static/js/showlabel.js"></script>
	<script>
		let csrf_token_showLabel = "{{csrf_token}}";
		let getLabelData_url = "{% url 'getLabelData' %}";
		let getDataDictionary_url = "{% url 'getDataDictionary' %}";
		let url_showLabel = "{{request.get_full_path}}";
		let dictionary_showLabel;
		let static_showLabel;
	</script>
	<script>
	(function(){
			let bill_save = viewer.entities;
			static_showLabel=new Cesium.Entity();
			let textw={a:0};
			viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
			viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_CLICK);
			{% for label in labels %}
				bill_save.add({
					id:"{{label.id}}",
					position : new Cesium.Cartesian3( {{ label.coord_x }}, {{ label.coord_y }}, {{ label.coord_z }} ),
					name:name,
					parent:static_showLabel,
					billboard:{
						image : drawCanvas( {{ label.category }}, "{{ label.name }}" ,textw),
						verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
						horizontalOrigin:Cesium.HorizontalOrigin.LEFT,
						disableDepthTestDistance:Number.POSITIVE_INFINITY,
						pixelOffset:new Cesium.Cartesian2(-textw.a,0),
					}
				});
			{% endfor %}
			getDataDictionary();
			
			//alert($.parseJSON('[{"house":{"area":30,"owner":"刘超"}}]'));
			addLabelClickEvent();
	}())
	</script>
</body>
</html>
