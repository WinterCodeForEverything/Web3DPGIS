  <script>
	function drawCanvas( imageSource, labelName ) 
	{
		var fontsize = 20;
		var canvas = document.createElement('canvas');      //创建canvas标签 
		var ctx = canvas.getContext('2d');
		canvas.width =  ctx.measureText( labelName ).width * 1.8 + fontsize;	//根据文字内容获取宽度
		canvas.height = fontsize * 1.1;	
		ctx.globalAlpha = 0.6;
		ctx.fillStyle = "black";
		ctx.fillRect( fontsize, 0, canvas.width, canvas.height );
		//ctx.fillStyle = 'white';
		//ctx.fillRect( 0, 0, fontsize, fontsize  );
		ctx.font = fontsize + "px Calibri,sans-serif";
		ctx.drawImage( imageSource, 0, 0, fontsize, fontsize );
		ctx.fillStyle = "white";
		ctx.globalAlpha = 1;
		ctx.fillText( labelName, fontsize, fontsize );
		return canvas;
	}	
	(function(){
		modelshow_bill_save = viewer.scene.primitives.add(new Cesium.BillboardCollection());
		var label_array = [];
		{% for label in labels %}
			label_array.push( [ {{ label.coord_x }}, {{ label.coord_y }}, {{ label.coord_z }}, "{{ label.name }}", "{{ label.labelbase.source }}" ] );
		{% endfor %}
		initLabel( 0 );
		function initLabel( num )
		{
			if ( num < label_array.length )
			{
				var label = label_array[num];
				var canvas_image = new Image();
				canvas_image.src = "/media/label/" + label[4];
				canvas_image.onload=function(){
					modelshow_bill_save.add({
						position : new Cesium.Cartesian3( label[0], label[1], label[2] ),
						image : drawCanvas( canvas_image, label[3]),
						verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
						horizontalOrigin:Cesium.HorizontalOrigin.LEFT,
						disableDepthTestDistance:Number.POSITIVE_INFINITY,
						pixelOffset:new Cesium.Cartesian2( -10, 0 ),
					});
					initLabel( ++num );
				};
			}
			
		}
	}());
  </script>
